# fly.toml app configuration file generated for jumpgate-bridge on 2026-02-09T10:54:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jumpgate-bridge'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'node scripts/production-release-protocols.js apply-env'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PUBLIC_BASE_URL = 'https://jumpgate-bridge.fly.dev'
  JUMPGATE_TRUST_PROXY = '1'
  JUMPGATE_DURABLE_DRIVER = 'postgres'
  JUMPGATE_TTL_DRIVER = 'redis'
  JUMPGATE_PROVIDER_MUTATION_MODE = 'fenced'
  JUMPGATE_POSTGRES_MIGRATION_CEILING = '0011_history_http_receipts'
  JUMPGATE_REDIS_PLAYBACK_WRITE_VERSION = '4'
  JUMPGATE_REDIS_PLAYBACK_CLAIM_ROLLOUT_MODE = 'v6'
  JUMPGATE_SUBTITLE_S3_BUCKET = 'jumpgate-bridge-subtitles-live'
  JUMPGATE_SUBTITLE_S3_REGION = 'auto'
  JUMPGATE_SUBTITLE_S3_ENDPOINT = 'https://fly.storage.tigris.dev'
  JUMPGATE_SUBTITLE_S3_FORCE_PATH_STYLE = '0'
  # Tigris retains one private one-byte canary per object-key generation.
  JUMPGATE_SUBTITLE_S3_PRIVACY_MODE = 'tigris-policy-status'
  # Enabled only after the retained snapshot bucket passed the live exact-version purge proof.
  JUMPGATE_SUBTITLE_PERMANENT_ERASURE_MODE = 'tigris-version-purge-v1'

# Required secret names: CONFIG_SECRET, DATABASE_URL, REDIS_URL,
# JUMPGATE_TOKEN_PEPPER, JUMPGATE_ENVELOPE_PRIMARY_KEY_ID,
# JUMPGATE_ENVELOPE_KEYRING, JUMPGATE_SUBTITLE_S3_ACCESS_KEY_ID,
# JUMPGATE_SUBTITLE_S3_SECRET_ACCESS_KEY,
# JUMPGATE_SUBTITLE_OBJECT_KEY_CURRENT_ID,
# JUMPGATE_SUBTITLE_OBJECT_KEY_KEYRING, and TRAKT_CLIENT_SECRET.
# Optional registered-client override: TRAKT_CLIENT_ID. Without it, Bridge uses the
# intentional public client ID; its configured secret must match the selected ID.
# Set their real values with `fly secrets set`; never commit them here.

[http_service]
  internal_port = 7515
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health/ready'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
